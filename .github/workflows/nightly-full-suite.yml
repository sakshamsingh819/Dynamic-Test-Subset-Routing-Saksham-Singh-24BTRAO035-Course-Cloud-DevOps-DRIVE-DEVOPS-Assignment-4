name: Nightly Full Regression Guardrail

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

jobs:
  full-regression-safety-net:
    name: "100% Full Regression Guardrail"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Full Test Suite (Safety Net)
        run: |
          echo "Running 100% full regression test suite across all domains..."
          pytest -v --cov=src --cov-report=term-missing tests/
